<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail SOP Resep - Rummi</title>
    <!-- Google Fonts Gayathri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gayathri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- Topbar Navigasi Header -->
    <header class="app-topbar">
        <a href="catalog.html" class="topbar-btn">Rummi KMS</a>
        <nav class="topbar-manager-nav">
            <a href="dashboard.html" class="topbar-link">Dashboard</a>
            <a href="catalog.html" class="topbar-link">Katalog</a>
            <a href="profile.html" class="topbar-link">Profil</a>
        </nav>
    </header>

    <!-- Ornamen Latar Belakang -->
    <div class="ornament-bg-top">
        <img src="assets/img/burung.png" alt="" onerror="this.style.display='none';">
    </div>
    <div class="ornament-bg-bottom">
        <img src="assets/img/kopi.png" alt="" onerror="this.style.display='none';">
    </div>

    <main class="staff-container detail-page-flow">
        <!-- Tombol Kembali Bundar Marun Sesuai Desain -->
        <div class="back-nav-row">
            <a href="catalog.html" class="back-circle-btn" title="Kembali ke Beranda">
                &larr;
            </a>
            <span class="back-nav-label">Kembali Ke Beranda</span>
        </div>

        <!-- KARTU 1: Informasi Header Menu -->
        <div class="staff-detail-card">
            <h1 class="detail-menu-title" id="menuTitle">Memuat Menu...</h1>
            <p class="detail-menu-desc" id="menuDesc"></p>
            <div class="detail-menu-tag" id="menuTag"></div>
        </div>

        <!-- KARTU 2: Standar Gramasi & Komposisi -->
        <div class="staff-detail-card">
            <h2 class="detail-section-title">Standar Gramasi<br>& Komposisi</h2>
            
            <table class="detail-grammage-table">
                <thead>
                    <tr>
                        <th class="col-ingredient">Bahan Baku</th>
                        <th class="col-qty">Takaran</th>
                    </tr>
                </thead>
                <tbody id="ingredientsBody">
                    <!-- Rincian bahan di-render via JS -->
                </tbody>
            </table>
        </div>

        <!-- KARTU 3: Langkah Pembuatan & SOP Penyajian -->
        <div class="staff-detail-card">
            <h2 class="detail-section-title">Langkah Pembuatan<br>& SOP Penyajian</h2>

            <div class="detail-steps-wrapper" id="stepsWrapper">
                <!-- Rincian SOP di-render via JS -->
            </div>
        </div>
    </main>

    <!-- Pita Batik Bawah -->
    <div class="bottom-batik-band"></div>

    <script>
        // Mock Database Detail Resep
        const recipesData = {
            1: {
                name: "Kopi Susu Rummi",
                description: "Signature aren latte dengan racikan susu gurih dan espresso house blend seimbang.",
                category_name: "Espresso Based",
                ingredients: [
                    { ingredient_name: "Espresso House Blend", quantity: "36", unit: "ml" },
                    { ingredient_name: "Fresh Milk", quantity: "100", unit: "ml" },
                    { ingredient_name: "Susu Evaporasi", quantity: "20", unit: "ml" },
                    { ingredient_name: "Gula Aren Cair Rummi", quantity: "25", unit: "ml" },
                    { ingredient_name: "Es Batu Kristal", quantity: "150", unit: "gr" }
                ],
                steps: [
                    { step_number: 1, instruction: "Tuangkan 25 ml sirup gula aren cair ke dasar gelas saji 16 oz." },
                    { step_number: 2, instruction: "Masukkan es batu kristal sebanyak 150 gram ke dalam gelas saji." },
                    { step_number: 3, instruction: "Campurkan fresh milk dan susu evaporasi, lalu tuangkan secara perlahan ke atas es batu." },
                    { step_number: 4, instruction: "Lakukan kalibrasi ekstraksi espresso ganda (36 ml), tuangkan perlahan di layer paling atas." },
                    { step_number: 5, instruction: "Tutup gelas saji dengan lid sealer/cup cover steril, siap disajikan." }
                ]
            },
            2: {
                name: "V60 Flores Bajawa",
                description: "Seduhan manual filter dengan tasting notes cokelat, nutty, dan keasaman sitrun lembut.",
                category_name: "Manual Brew",
                ingredients: [
                    { ingredient_name: "Biji Kopi Flores Bajawa", quantity: "15", unit: "gr" },
                    { ingredient_name: "Air Mineral Bersuhu 92°C", quantity: "225", unit: "ml" }
                ],
                steps: [
                    { step_number: 1, instruction: "Bilas kertas filter V60 dengan air panas untuk menghilangkan aroma kertas." },
                    { step_number: 2, instruction: "Giling 15 gram biji kopi dengan ukuran medium-fine, ratakan di atas dripper." },
                    { step_number: 3, instruction: "Tuangan pertama (Blooming): Tuang 45 ml air panas, tunggu 30 detik." },
                    { step_number: 4, instruction: "Tuangan kedua & ketiga: Tuang secara perlahan melingkar hingga total volume 225 ml tercapai dalam 2 menit 15 detik." }
                ]
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || 1;
            const data = recipesData[id] || recipesData[1];

            // Render Header
            document.getElementById('menuTitle').textContent = data.name;
            document.getElementById('menuDesc').textContent = data.description;
            if (data.category_name) {
                document.getElementById('menuTag').textContent = `#${data.category_name}`;
            }

            // Render Komposisi
            const tbody = document.getElementById('ingredientsBody');
            tbody.innerHTML = data.ingredients.map(ing => `
                <tr>
                    <td class="col-ingredient">${ing.ingredient_name}</td>
                    <td class="col-qty">${ing.quantity} ${ing.unit}</td>
                </tr>
            `).join('');

            // Render Langkah SOP
            const stepsWrap = document.getElementById('stepsWrapper');
            stepsWrap.innerHTML = data.steps.map(st => `
                <div class="detail-step-item">
                    <div class="step-circle-badge">${st.step_number}</div>
                    <div class="step-text-content">${st.instruction}</div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
