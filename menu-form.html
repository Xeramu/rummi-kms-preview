<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Formula Menu - Rummi KMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gayathri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- Topbar Navigasi -->
    <header class="app-topbar">
        <a href="catalog.html" class="topbar-btn">Rummi KMS</a>
        <nav class="topbar-manager-nav">
            <a href="dashboard.html" class="topbar-link">Dashboard</a>
            <a href="menu-manage.html" class="topbar-link">Menu</a>
            <a href="master-manage.html" class="topbar-link">Master</a>
            <a href="user-manage.html" class="topbar-link">User</a>
            <a href="profile.html" class="topbar-link">Profil</a>
        </nav>
    </header>

    <!-- Ornamen Latar Belakang -->
    <div class="ornament-bg-top">
        <img src="assets/img/burung.png" alt="" onerror="this.style.display='none';">
    </div>
    <div class="ornament-bg-bottom">
        <img src="assets/img/kopi.png" alt="" onerror="this.style.display='none';">
    </div>

    <main class="staff-container detail-page-flow">
        <!-- Tombol Kembali Bundar Marun -->
        <div class="back-nav-row" style="max-width: 360px;">
            <a href="menu-manage.html" class="back-circle-btn" title="Kembali ke Kelola Menu">
                &larr;
            </a>
            <span class="back-nav-label">Kembali Ke Beranda</span>
        </div>

        <!-- KARTU FORMULA MENU -->
        <div class="staff-detail-card menu-form-card">
            <h1 class="form-card-title" id="formTitle" style="margin-bottom: 22px;">
                Tambah Menu Baru
            </h1>

            <form onsubmit="handleFormSubmit(event)" class="user-pill-form">
                <!-- Nama Menu -->
                <div class="form-group-custom">
                    <label class="form-label-custom">Nama Menu</label>
                    <input type="text" id="menuName" class="input-pill-small" placeholder="Nama menu..." required>
                </div>

                <!-- Kategori -->
                <div class="form-group-custom">
                    <label class="form-label-custom">Kategori</label>
                    <select id="menuCat" class="input-pill-small select-pill" required>
                        <option value="">Pilih Kategori</option>
                        <option value="Espresso Based">Espresso Based (Beverage Cold)</option>
                        <option value="Manual Brew">Manual Brew (Beverage Hot)</option>
                        <option value="Signature Mocktail">Signature Mocktail (Beverage Cold)</option>
                        <option value="Non-Coffee">Non-Coffee (Beverage Hot)</option>
                    </select>
                </div>

                <!-- Waktu Saji -->
                <div class="form-group-custom">
                    <label class="form-label-custom">Waktu Saji (Menit)</label>
                    <input type="number" step="0.5" id="servingTime" class="input-pill-small" placeholder="cth: 3.5" value="3.0" required>
                </div>

                <!-- Status Menu -->
                <div class="form-group-custom" id="statusGroup">
                    <label class="form-label-custom">Status Menu</label>
                    <select id="menuStatus" class="input-pill-small select-pill">
                        <option value="active">Aktif</option>
                        <option value="inactive">Non Aktif</option>
                    </select>
                </div>

                <!-- Deskripsi -->
                <div class="form-group-custom">
                    <label class="form-label-custom">Deskripsi Rasa & Karakteristik</label>
                    <textarea id="menuDesc" class="input-pill-small textarea-pill" placeholder="Deskripsi karakteristik rasa..." rows="3" required></textarea>
                </div>

                <!-- KOMPOSISI TAKARAN BAHAN -->
                <div class="section-divider-title">
                    <span>Komposisi Takaran Bahan</span>
                    <button type="button" class="btn-mini-maroon" onclick="addIngredientRow()">+ Tambah</button>
                </div>

                <div id="ingredient-container" class="dynamic-group-wrapper">
                    <div class="ingredient-card-item">
                        <select class="input-pill-small select-pill" required>
                            <option value="">Pilih Bahan</option>
                            <option value="Espresso House Blend">Espresso House Blend</option>
                            <option value="Fresh Milk">Fresh Milk</option>
                            <option value="Susu Evaporasi">Susu Evaporasi</option>
                            <option value="Sirup Gula Aren Rummi">Sirup Gula Aren Rummi</option>
                            <option value="Es Batu Kristal">Es Batu Kristal</option>
                        </select>
                        <div class="ingredient-measure-row">
                            <input type="number" step="0.01" class="input-pill-small" placeholder="Jumlah" required style="flex: 1;">
                            <select class="input-pill-small select-pill" required style="flex: 1.2;">
                                <option value="">Satuan</option>
                                <option value="ml">ml (Mililiter)</option>
                                <option value="gr">gr (Gram)</option>
                                <option value="pump">pump (Sendok Takar)</option>
                            </select>
                            <button type="button" class="btn-remove-circle" onclick="removeIngredientRow(this)" title="Hapus bahan">✕</button>
                        </div>
                    </div>
                </div>

                <!-- LANGKAH PEMBUATAN SOP -->
                <div class="section-divider-title" style="margin-top: 10px;">
                    <span>Langkah Pembuatan SOP</span>
                    <button type="button" class="btn-mini-maroon" onclick="addStepRow()">+ Tambah</button>
                </div>

                <div id="step-container" class="dynamic-group-wrapper">
                    <div class="step-card-item">
                        <div class="step-circle-badge-small">1</div>
                        <input type="text" class="input-pill-small" placeholder="Instruksi langkah ke-1..." required style="flex: 1;">
                        <button type="button" class="btn-remove-circle" onclick="removeStepRow(this)" title="Hapus langkah">✕</button>
                    </div>
                </div>

                <!-- TOMBOL SIMPAN & BATAL -->
                <div class="form-submit-row">
                    <button type="submit" class="btn-pill-submit-form">
                        Simpan Formula Lengkap
                    </button>
                    <a href="menu-manage.html" class="btn-pill-cancel-form">
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Pita Batik Bawah -->
    <div class="bottom-batik-band"></div>

    <script>
        function renumberSteps() {
            const badges = document.querySelectorAll('#step-container .step-circle-badge-small');
            badges.forEach((b, index) => {
                b.innerText = index + 1;
            });
        }

        function addIngredientRow() {
            const container = document.getElementById('ingredient-container');
            const firstItem = container.querySelector('.ingredient-card-item');
            const clone = firstItem.cloneNode(true);
            clone.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
            clone.querySelector('input').value = '';
            container.appendChild(clone);
        }

        function removeIngredientRow(btn) {
            const items = document.querySelectorAll('#ingredient-container .ingredient-card-item');
            if (items.length > 1) {
                btn.closest('.ingredient-card-item').remove();
            } else {
                alert('Minimal harus terdapat 1 bahan komposisi.');
            }
        }

        function addStepRow() {
            const container = document.getElementById('step-container');
            const firstItem = container.querySelector('.step-card-item');
            const clone = firstItem.cloneNode(true);
            clone.querySelector('input').value = '';
            container.appendChild(clone);
            renumberSteps();
        }

        function removeStepRow(btn) {
            const items = document.querySelectorAll('#step-container .step-card-item');
            if (items.length > 1) {
                btn.closest('.step-card-item').remove();
                renumberSteps();
            } else {
                alert('Minimal harus terdapat 1 tahapan langkah pembuatan SOP.');
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            alert('Mockup: Formula resep SOP berhasil disimpan!');
            window.location.href = 'menu-manage.html';
        }

        // Cek mode edit via URL parameter
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('id')) {
                document.getElementById('formTitle').textContent = 'Sunting Formula Menu';
                document.getElementById('menuName').value = 'Kopi Susu Rummi';
                document.getElementById('menuCat').value = 'Espresso Based';
                document.getElementById('servingTime').value = '3.0';
                document.getElementById('menuDesc').value = 'Signature aren latte dengan racikan susu gurih dan espresso house blend seimbang.';
            }
        });
    </script>
</body>
</html>
