<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna - Rummi KMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gayathri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Topbar Navigasi -->
    <header class="app-topbar">
        <a href="catalog.html" class="topbar-btn">Rummi KMS</a>
        <nav class="topbar-manager-nav">
            <a href="dashboard.html" class="topbar-link">Dashboard</a>
            <a href="menu-manage.html" class="topbar-link">Menu</a>
            <a href="master-manage.html" class="topbar-link">Master</a>
            <a href="user-manage.html" class="topbar-link">User</a>
            <a href="profile.html" class="topbar-link">Profil</a>
        </nav>
    </header>

    <!-- Ornamen Latar Belakang Statis -->
    <div class="ornament-bg-top">
        <img src="assets/img/burung.png" alt="" onerror="this.style.display='none';">
    </div>
    <div class="ornament-bg-bottom">
        <img src="assets/img/kopi.png" alt="" onerror="this.style.display='none';">
    </div>

    <main class="staff-container detail-page-flow">
        <!-- Tombol Kembali Bundar Marun -->
        <div class="back-nav-row" style="max-width: 360px;">
            <a href="catalog.html" class="back-circle-btn" title="Kembali ke Beranda">
                &larr;
            </a>
            <span class="back-nav-label">Kembali Ke Beranda</span>
        </div>

        <!-- Wadah Notifikasi Alert -->
        <div id="alertBoxSuccess" class="alert-box-success" style="display: none; margin-bottom: 12px;">
            Kata sandi berhasil diperbarui!
        </div>
        <div id="alertBoxError" class="alert-box-error" style="display: none; margin-bottom: 12px;"></div>

        <!-- KARTU UTAMA PROFIL PENGGUNA -->
        <div class="staff-detail-card profile-card-box">
            <h1 class="profile-card-title">Profil Pengguna</h1>
            <p class="profile-card-subtitle">
                Informasi akun dan manajemen keamanan kata sandi mandiri
            </p>

            <!-- Informasi Identitas Akun -->
            <div class="profile-info-group">
                <div class="profile-field-row">
                    <label class="form-label-custom">Nama Lengkap</label>
                    <div class="profile-display-pill" id="profileFullName">
                        Manager Operasional
                    </div>
                </div>

                <div class="profile-field-row">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
                        <label class="form-label-custom">Username</label>
                        <span class="profile-role-tag" id="profileRoleTag">
                            #Manager
                        </span>
                    </div>
                    <div class="profile-display-pill" id="profileUsername">
                        @manager_rummi
                    </div>
                </div>
            </div>

            <!-- Garis Pembatas Horisontal -->
            <div class="profile-divider-line"></div>

            <!-- FORMULIR UBAH KATA SANDI -->
            <div class="profile-section-heading">Ubah Kata Sandi</div>

            <form onsubmit="handlePasswordUpdate(event)" class="user-pill-form">
                <div class="form-group-custom">
                    <label class="form-label-custom">Kata Sandi Saat Ini</label>
                    <input 
                        type="password" 
                        id="currentPassword" 
                        class="input-pill-small" 
                        placeholder="Masukkan sandi saat ini..." 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-group-custom">
                    <label class="form-label-custom">Kata Sandi Baru</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        class="input-pill-small" 
                        placeholder="Minimal 6 karakter..." 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group-custom">
                    <label class="form-label-custom">Konfirmasi Kata Sandi Baru</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="input-pill-small" 
                        placeholder="Ketik ulang sandi baru..." 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <!-- Tombol Aksi Kapsul Marun -->
                <button type="submit" class="btn-profile-submit">
                    Simpan Kata Sandi Baru
                </button>
            </form>
        </div>
    </main>

    <!-- Pita Batik Bawah Statis -->
    <div class="bottom-batik-band"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Membaca status role tersimpan jika ada
            const role = localStorage.getItem('rummi_user_role') || 'manager';
            if (role === 'staff') {
                document.getElementById('profileFullName').textContent = 'Ahmad Barista';
                document.getElementById('profileUsername').textContent = '@ahmad_rummi';
                document.getElementById('profileRoleTag').textContent = '#Staff';
            }
        });

        function handlePasswordUpdate(e) {
            e.preventDefault();
            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            const errBox = document.getElementById('alertBoxError');
            const successBox = document.getElementById('alertBoxSuccess');
            errBox.style.display = 'none';
            successBox.style.display = 'none';

            if (newPass.length < 6) {
                errBox.textContent = 'Kata sandi baru minimal harus 6 karakter!';
                errBox.style.display = 'block';
                return;
            }

            if (newPass !== confirmPass) {
                errBox.textContent = 'Konfirmasi kata sandi tidak cocok!';
                errBox.style.display = 'block';
                return;
            }

            // Simulasi sukses
            successBox.textContent = 'Kata sandi berhasil diperbarui (Simulasi Mockup)!';
            successBox.style.display = 'block';

            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }
    </script>
</body>
</html>
